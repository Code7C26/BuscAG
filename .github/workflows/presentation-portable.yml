name: Presentation portable Windows and Linux
on:
  push:
    branches: ['presentation/**']
    paths: ['presentation/**', '.github/workflows/presentation-portable.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: presentation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: presentation/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:portable
      - run: npx playwright install --with-deps chromium
      - run: npm run pack:windows
      - name: Extract the newly generated ZIP
        shell: pwsh
        run: Expand-Archive -LiteralPath descargas/BuscAG-Windows-completo.zip -DestinationPath packaged
      - name: Browser QA uses the extracted package, without rebuilding it
        shell: pwsh
        run: |
          $env:BUSCAG_TEST_PACKAGE_DIR = (Resolve-Path packaged/BuscAG-presentation).Path
          npm run test:browser
