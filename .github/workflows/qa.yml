name: BuscAG local QA
on:
  push:
    branches: [Alexis]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/code/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run qa:local
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulated-browser-qa
          path: |
            src/code/test-results/
            src/code/playwright-report/
          retention-days: 7
