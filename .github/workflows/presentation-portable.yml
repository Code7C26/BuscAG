name: Presentation portable Windows and Linux
on:
  push:
    branches: ['presentation/**']
    paths: ['presentation/**', '.github/workflows/presentation-portable.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: presentation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: presentation/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run verify:qr
      - run: npm run test:portable
      - run: npx playwright install --with-deps chromium
      - run: npm run test:classroom
      - run: npm run pack:windows
        env:
          BUSCAG_PACKAGE_OUTPUT: generated
      - name: Verify and extract the published ZIP exactly as downloaded
        shell: pwsh
        run: |
          $expected = ((Get-Content descargas/SHA256.txt) -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash descargas/BuscAG-Windows-completo.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Published ZIP checksum mismatch" }
          Expand-Archive -LiteralPath descargas/BuscAG-Windows-completo.zip -DestinationPath packaged
      - name: Browser QA uses the extracted package, without rebuilding it
        shell: pwsh
        run: |
          $env:BUSCAG_TEST_PACKAGE_DIR = (Resolve-Path packaged/BuscAG-presentation).Path
          npm run test:browser
  public-link-preflight:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node presentation/scripts/check-public-links.mjs
      - run: node presentation/scripts/check-voting-public.mjs
